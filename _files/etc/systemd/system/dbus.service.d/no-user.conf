# dbus-daemon drops to the messagebus user itself, from <user>messagebus</user> in
# /usr/share/dbus-1/system.conf. dbus.service *also* sets User=/Group=, so systemd has
# already dropped privileges by the time _dbus_change_to_daemon_user() runs, and its
# setgroups(0, NULL) fails with EPERM — "Failed to drop supplementary groups" at every
# boot. dbus treats that as non-fatal, so it is only noise, but clearing User=/Group=
# here lets the daemon do the drop as root the way its own code expects. The end state
# is the same process running as messagebus, minus the warning.
[Service]
User=
Group=
