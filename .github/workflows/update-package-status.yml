name: Package update status

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  update:
    if: github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - name: Complete pull request check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq '.[0].number')
          [ -n "$PR_NUMBER" ] || { echo "no open pull request for $BRANCH"; exit 0; }

          CHECK_ID=$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs" \
            --jq '.check_runs[] | select(.name == "Package update CI") | .id' | head -n 1)
          [ -n "$CHECK_ID" ] || { echo "no package update check for $SHA"; exit 0; }

          gh api --method PATCH "repos/$REPOSITORY/check-runs/$CHECK_ID" \
            -f status=completed \
            -f conclusion="$CONCLUSION" \
            -f details_url="$RUN_URL" \
            -f 'output[title]=Package update CI' \
            -f "output[summary]=CI finished with conclusion: $CONCLUSION" \
            >/dev/null

          echo "updated check $CHECK_ID for PR #$PR_NUMBER: $CONCLUSION"