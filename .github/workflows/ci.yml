name: CI
on:
  # Everything below this line compiles 36 packages on two architectures and boots the
  # result four times on each, and not one step of it reads a markdown file: the build
  # context is builder/ and image/ (see .containerignore), and the only documentation
  # that ends up in an image is generated. A push that touches nothing but prose has
  # nothing here to verify, and running the workflow anyway spends an hour of runner
  # time proving that a sentence was rewritten.
  #
  # paths-ignore is all-or-nothing over the files a push changed, which is the safe
  # direction: a commit touching both a doc and a build.sh runs everything. The patterns
  # are deliberately narrow. `*.md` is the two at the repository root, README.md and
  # CLAUDE.md — not `**.md`, because image/files is COPYied into the assembly container
  # and a markdown file added under there would be part of an image rather than part of
  # the prose about one.
  #
  # The cost is that a docs-only pull request gets no check run from this workflow at
  # all: filtered out is not the same as passing, it is absent. Nothing depends on that
  # today — main has no branch protection and no rulesets, so no check is required — and
  # licenses.yml is unfiltered, so such a pull request still reports something. If
  # required checks are ever turned on, this has to become a path filter feeding a
  # per-job `if:` instead, or merging a typo fix will block forever on a check that
  # never reports.
  #
  # workflow_dispatch stays unfiltered, so a run can always be forced by hand.
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  pull-requests: write

# Every job below is matrixed on arch (amd64/arm64) and runs on a runner native to that
# arch — nothing here cross-compiles, so a native runner is what makes `make defconfig`,
# `gcc -print-multiarch` and friends pick the right target on their own (see
# packages/kernel/build.sh, image/build-rootfs.sh). The `runner` value
# each matrix carries via `include` is the GitHub-hosted arm64 label as of this writing;
# adjust it if your plan/org exposes it under a different name or you're pointing this
# at self-hosted arm64 runners instead.
#
# `needs:` is a job-level dependency, not a matrix-aware one: e.g. `rootfs`'s `needs:
# [build, kernel]` waits for *both* arches of `build` and `kernel` to finish before
# *either* arch of `rootfs` starts, even though rootfs-amd64 only actually needs
# build-amd64 and kernel-amd64. That costs a little wall-clock time but keeps the
# workflow from having to duplicate every job definition per arch.

# Prep is the only place in this workflow that is allowed to reach the internet. It
# publishes the two images every job below consumes, both tagged by content hash
# (tools/image-tags.sh), so a tag that already exists in the registry is pulled rather
# than rebuilt and an unchanged dependency list costs one HEAD request. Every build job
# after this runs its compile with --network=none. See docs/build-container.md.
jobs:
  # One per architecture: the toolchain is compiled software and nothing here
  # cross-compiles, so the tag carries the arch and each native runner pushes its own.
  builder:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          # Text rather than mermaid, which is about the run summary page and
          # not about any one job. GitHub renders every mermaid block in its own
          # sandboxed iframe against viewscreen.githubusercontent.com, and the
          # run page concatenates all 77 jobs' summaries: at ~11 blocks a job
          # that is ~860 iframes on one page, which no browser stays responsive
          # through. Sparklines in a markdown table cost the page nothing and
          # carry the same shape, peak and mean at lower resolution.
          #
          # Set on every telemetry step in this workflow for that one reason —
          # the cost is the page they share, so they share the setting.
          charts: sparkline

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: ./tools/prep.sh --push builder

  # Once for both architectures: the tarballs are the same bytes either way, so this is a
  # manifest list built from a single COPY rather than 450 MB stored twice. It is also
  # the copy of upstream that outlives upstream — see the doc.
  sources:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          charts: sparkline # see the builder job

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: ./tools/prep.sh --push sources

  # Everything else is compiled against this glibc rather than the Debian builder's, so
  # it has to be staged before the matrix below can start. The kernel is the exception:
  # it links no libc at all, so it runs alongside instead of queueing behind.
  glibc:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    needs:
      - builder
      - sources
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          charts: sparkline # see the builder job

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: glibc
          arch: ${{ matrix.arch }}
          sysroot: 'false'

  kernel:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    needs:
      - builder
      - sources
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          charts: sparkline # see the builder job

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: kernel
          arch: ${{ matrix.arch }}
          sysroot: 'false'

  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    needs:
      - glibc

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        package:
          - acl
          - attr
          - bash
          # Data again, and from a distribution rather than an upstream: Mozilla's root
          # certificates as Debian snapshots and parses them. Nothing to compile.
          - ca-certificates
          - coreutils
          - crun
          - curl
          - dbus
          - e2fsprogs
          - elfutils
          - expat
          - findutils
          # Not an upstream project: packages/flfsfetch/src is this repository's own C,
          # built by the same machinery as everything else. See CLAUDE.md.
          - flfsfetch
          - gawk
          - grep
          - gzip
          # Data, not code: IANA's registries as the /etc/services and /etc/protocols
          # that nsswitch.conf has been naming all along. Its build.sh compiles nothing.
          - iana-etc
          - iproute2
          - iputils
          - json-c
          - kmod
          - libbpf
          - libcap
          - libmnl
          - libxcrypt
          - ncurses
          - openssl
          - pam
          - sed
          - systemd
          - tar
          - util-linux
          - xz
          - zlib
          - zstd
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          charts: sparkline # see the builder job

          # This matrix is 66 jobs a run and usually hits its build cache,
          # so the median job is ~16s. Installing forkstat for a process
          # trace costs about 5s of that, and a trace of a cache hit says
          # nothing. Resource metrics need no setup and still get collected.
          # The long jobs (kernel, glibc, boot, rootfs) keep full tracing.
          proc_trace_enable: false

          # And the summary those metrics would be written to is dropped, which
          # is about the run page rather than about this job. Every mermaid
          # block the action emits becomes its own iframe against
          # viewscreen.githubusercontent.com, and the run summary page
          # concatenates all 77 jobs' summaries: at ~11 blocks each that is
          # ~860 iframes on one page, which no browser stays responsive
          # through. Dropping the 66 jobs that have the least to say leaves
          # ~130 — the builder, sources, glibc, kernel, rootfs and boot jobs,
          # where the numbers are worth having.
          #
          # This is a stopgap and should not outlive its cause. Nothing here
          # consumes the metrics once the summary is off, so these jobs now
          # collect and discard them. The fix is upstream in the action, which
          # is being taught to render the same data as text — sparklines in a
          # markdown table, no iframes at all — at which point this line comes
          # back out and the pin moves instead.
          job_summary: false

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}

  rootfs:
    runs-on: ${{ matrix.runner }}
    # Spelled out because the "Image size over time" step reads the size artifact from
    # *previous* runs, and `actions: read` is what lets the job's token list and download
    # them. Same-run artifacts need none of this — actions/download-artifact uses the
    # runtime token for those, which is why this job managed without a block until now.
    #
    # pull-requests: write is not new and not this step's: it is what the job inherited
    # from the workflow-level default, and naming a block here replaces that default
    # rather than adding to it. The telemetry action comments on the pull request, so
    # dropping it would have turned this into a silent change to something else.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    needs:
      - build
      - kernel
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          charts: sparkline # see the builder job

      # Only this arch's packages: every package-<name>-<arch> artifact this run
      # produced matches the pattern, which is glibc, kernel and the whole build
      # matrix — the same set the old unfiltered download pulled in, just scoped to one
      # arch instead of grabbing the other arch's (mutually useless) binaries too.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*-${{ matrix.arch }}
          path: artifacts

      - run: find artifacts -name '*.tar' -exec tar xf {} \;

      - name: Display structure of downloaded files
        run: find rootfs

      # Packages are compiled against the Debian builder's libraries, so a missing
      # runtime dependency is invisible until the binary is exec'd in qemu.
      - name: Check for unresolved library dependencies
        run: ./test/check-rootfs-deps.sh rootfs

      # And a library that is present can still be the wrong one: this is what proves
      # the packages were built against our glibc and not the builder image's.
      - name: Check for unsatisfied symbol versions
        run: ./test/check-symbol-versions.sh rootfs

      # Cheap, and it names the missing feature. test/container.sh proves a container
      # actually runs, but only after four minutes of qemu and only as "crun exited 1".
      - name: Check the kernel can run containers
        run: ./test/kernel-caps.sh rootfs

      - run: mkdir -p output

      - name: Create disk image
        run: |
            podman build -t rootfs-builder -f image/Containerfile .
            podman run -e FLFS_BUILD="$GITHUB_SHA" --volume "$PWD"/rootfs:/usr/local/src --volume "$PWD"/output:/usr/local/output rootfs-builder /usr/local/bin/build-rootfs.sh ext4

      # The second output of the same staging tree: the same userspace with the kernel
      # and systemd taken back out, as an OCI image. It reuses the container built above.
      - name: Create OCI image
        run: podman run -e FLFS_BUILD="$GITHUB_SHA" --volume "$PWD"/rootfs:/usr/local/src --volume "$PWD"/output:/usr/local/output rootfs-builder /usr/local/bin/build-rootfs.sh oci

      # Loading it proves the hand-written OCI layout is well formed, and running it is
      # the only check in this job that executes a binary we shipped. It is not a
      # substitute for the boot job below: the container runs on the runner's kernel.
      - name: Run the OCI image
        run: FLFS_BUILD="$GITHUB_SHA" ./test/oci.sh output/flfs-oci.tar

      - name: Upload rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-dir-${{ matrix.arch }}
          path: rootfs

      # A few hundred bytes each, kept so two runs can be diffed directly rather than
      # through two job summaries.
      - name: Upload size reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-size-${{ matrix.arch }}
          path: output/rootfs-size-*.txt

      # image/build-rootfs.sh writes the SBOM by hand — there is no JSON serialiser in
      # image/Containerfile and adding one to emit thirty string fields would be the same
      # trade the OCI assembly already declined. That is only sound if something proves
      # the result parses, and this is where a JSON parser exists. It is also what makes
      # issue #75's "CI fails if it cannot be produced" true rather than aspirational, so
      # it is deliberately *not* continue-on-error.
      - name: Check the SBOM
        run: ./test/check-sbom.sh

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.arch }}
          path: output/sbom-*.json

      # Last, deliberately: every other check in this job asks whether the image works,
      # and a bigger one works fine right up until it doesn't fit. These ask how big each
      # got, against ceilings in test/size-budget.txt that have to be raised on purpose.
      # They run after the uploads so that failing one still leaves the images and the
      # breakdowns to look at, and they put those breakdowns in the job summary, which is
      # where "what grew?" gets answered.
      #
      # The disk first, being the real output of this repo — and `always()` on the second
      # so that an overage in the first still reports the other image's number rather than
      # hiding it until the next run.
      - name: Measure the disk image
        run: ./test/rootfs-size.sh ext4

      - name: Measure the OCI image
        if: always()
        run: ./test/rootfs-size.sh oci

      # And the same question asked from outside: the budget above is a number we chose,
      # this one is the base image somebody would use instead. Exceeding it is a failure
      # with no number to raise — see the script.
      - name: Compare the OCI image against debian-slim
        if: always()
        run: ARCH=${{ matrix.arch }} ./test/vs-debian-slim.sh

      # ...and then which way it is going, which the two steps above cannot say. A ceiling
      # fires once, after the growth has happened and usually some commits after the one
      # that caused it; this plots the last dozen builds on main and says what this one did
      # to the number, per flavour and per directory.
      #
      # `always()`, and emphatically so: the run where the budget check just failed is the
      # one where "which commit, and which directory" is worth most, and a step that only
      # reports on success would be silent exactly then.
      #
      # It reads the rootfs-size-<arch> artifact the step above already uploads, from past
      # runs — so there is no new state anywhere, and the history reaches exactly as far
      # back as artifact retention. `continue-on-error` because this is telemetry and
      # test/rootfs-size.sh is the enforcement: a summary that could fail a build would be
      # a bad trade. The script also declines rather than fails on its own, so this is
      # belt and braces.
      - name: Image size over time
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./test/size-history.sh ${{ matrix.arch }}

      - name: Upload rootfs.ext4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs.ext4-${{ matrix.arch }}
          path: output/rootfs.ext4

      - name: Upload OCI image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-image-${{ matrix.arch }}
          path: output/flfs-oci.tar

  # An image that builds and resolves all its libraries can still fail to boot, so
  # actually boot it: the kernel we build is in rootfs/boot/bzImage.
  boot:
    runs-on: ${{ matrix.runner }}
    needs:
      - rootfs
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          charts: sparkline # see the builder job

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs.ext4-${{ matrix.arch }}
          path: artifacts

      # Just the kernel package, not the whole assembled rootfs artifact: the image is
      # already in artifacts/rootfs.ext4 and qemu only needs the bzImage next to it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-kernel-${{ matrix.arch }}
          path: artifacts

      - run: tar xf artifacts/kernel.tar

      # test/*.sh pick the qemu binary, machine type and console device to match the
      # runner's own arch on their own (see test/boot.sh); the only thing this step
      # has to get right is installing the package that ships that binary. qemu-system-
      # arm is Debian/Ubuntu's name for the package that provides qemu-system-aarch64,
      # not a typo.
      - name: Install qemu
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi

      - name: Boot the image
        run: ./test/boot.sh artifacts/rootfs.ext4 rootfs/boot/bzImage

      # A second boot, this one all the way into systemd, asking whether systemd is happy
      # with itself: a package that ships a unit it cannot run leaves every boot
      # `degraded`, and nothing above notices. It also runs flfsfetch on the shell it
      # already has, which is the only time CI executes a shipped binary that is not on
      # systemd's or login's critical path — and prints the result, which is the point.
      - name: Check for failed units, and say hello
        run: ./test/systemd.sh artifacts/rootfs.ext4 rootfs/boot/bzImage

      # A third boot: networkd has to configure the NIC, resolved has to answer, and the
      # guest has to reach the outside world.
      - name: Check networking
        run: ./test/network.sh artifacts/rootfs.ext4 rootfs/boot/bzImage

      # And a fourth, which starts an actual container: the kernel's container.config
      # fragment and crun are only useful together, and nothing above this exercises
      # either of them.
      - name: Check containers
        run: ./test/container.sh artifacts/rootfs.ext4 rootfs/boot/bzImage

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-console-log-${{ matrix.arch }}
          path: output/*.log

  # The container image, published where it can be pulled from rather than only attached
  # to a run as an artifact. One job rather than a push step in each `rootfs` matrix leg,
  # because the useful thing to publish is a *manifest list* covering both architectures,
  # and that can only be assembled once both exist. Loading and pushing a foreign-arch
  # image needs no emulation — nothing here runs it — so this can be one amd64 runner.
  #
  # `needs: boot`, not `needs: rootfs`: the OCI and ext4 images are the same userspace
  # out of the same staging tree, so the boot job failing means the thing about to be
  # published is broken, whatever test/oci.sh made of it in isolation.
  #
  # Only on main. The per-arch tags are commit-scoped and would be harmless from a
  # branch, but `latest` is a name with one holder, and a branch build taking it is how
  # `podman pull` starts serving something nobody merged.
  publish-oci:
    runs-on: ubuntu-26.04
    needs:
      - boot
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both, unmerged: tools/publish-oci.sh reads them at the per-artifact paths this
      # leaves behind, artifacts/oci-image-<arch>/flfs-oci.tar.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oci-image-*
          path: artifacts

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: ./tools/publish-oci.sh
