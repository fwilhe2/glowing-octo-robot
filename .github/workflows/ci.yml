name: CI
on:
  push:
  workflow_dispatch:

jobs:
  base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          echo todo
    #     ./build-base.sh
    #     podman save --quiet -o ${{ runner.temp }}/myimage.tar localhost/abstract-lfs-builder

    # - name: Upload artifact
    #   uses: actions/upload-artifact@v5
    #   with:
    #     name: myimage
    #     path: ${{ runner.temp }}/myimage.tar

  build:
    runs-on: ubuntu-24.04
    needs:
      - base

    strategy:
      fail-fast: false
      matrix:
        package:
          - acl
          - attr
          - bash
          - coreutils
          - e2fsprogs
          - glibc
          - kmod
          - libcap
          - libxcrypt
          - ncurses
          - pam
          - systemd
          - util-linux
          - xz
          - zlib
          - zstd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # - name: Download artifact
      #   uses: actions/download-artifact@v6
      #   with:
      #     name: myimage
      #     path: ${{ runner.temp }}

      # - name: Load image
      #   run: |
      #     podman load --input ${{ runner.temp }}/myimage.tar
      #     podman image ls -a

      - name: Get Cache key
        id: get_key
        run: |
          PKG="${{ matrix.package }}"
          source $PKG/env.sh
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "build_script_sum=$(cat build.sh build-base.sh Containerfile package.Containerfile lib/build-package.sh $PKG/build.sh $PKG/env.sh | md5sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

      - name: Cache
        id: cache-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rootfs
          key: ${{ steps.get_key.outputs.package }}-${{ steps.get_key.outputs.build_script_sum }}

      - name: Build
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          ./build.sh ${{ matrix.package }}

      - name: Tar files to preserve permissions
        run: tar cvf ${{ matrix.package }}.tar rootfs/*

      - name: Upload Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.package }}
          path: ${{ matrix.package }}.tar

  rootfs:
    runs-on: ubuntu-24.04
    needs:
      - build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages

      - run: find packages -name '*.tar' -exec tar xf {} \;

      - name: Display structure of downloaded files
        run: find rootfs

      # Packages are compiled against the Debian builder's libraries, so a missing
      # runtime dependency is invisible until the binary is exec'd in qemu.
      - name: Check for unresolved library dependencies
        run: ./check-rootfs-deps.sh rootfs

      - run: mkdir -p output

      - name: Create disk image
        run: |
            podman build -t rootfs-builder -f rootfs.Containerfile .
            podman run --volume "$PWD"/rootfs:/usr/local/src --volume "$PWD"/output:/usr/local/output rootfs-builder /usr/local/bin/build-rootfs.sh

      - name: Upload rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-dir
          path: rootfs

      - name: Upload rootfs.ext4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs.ext4
          path: output/rootfs.ext4
