name: CI
on:
  push:
  workflow_dispatch:

jobs:
  base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          echo todo
    #     ./build-base.sh
    #     podman save --quiet -o ${{ runner.temp }}/myimage.tar localhost/abstract-lfs-builder

    # - name: Upload artifact
    #   uses: actions/upload-artifact@v5
    #   with:
    #     name: myimage
    #     path: ${{ runner.temp }}/myimage.tar

  # Everything else is compiled against this glibc rather than the Debian builder's, so
  # it has to be staged before the matrix below can start. The kernel is the exception:
  # it links no libc at all, so it runs alongside instead of queueing behind.
  glibc:
    runs-on: ubuntu-24.04
    needs:
      - base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-package
        with:
          package: glibc
          sysroot: 'false'

  kernel:
    runs-on: ubuntu-24.04
    needs:
      - base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-package
        with:
          package: kernel
          sysroot: 'false'

  build:
    runs-on: ubuntu-24.04
    needs:
      - glibc

    strategy:
      fail-fast: false
      matrix:
        package:
          - acl
          - attr
          - bash
          - coreutils
          - dbus
          - e2fsprogs
          - expat
          - kmod
          - libcap
          - libxcrypt
          - ncurses
          - pam
          - systemd
          - util-linux
          - xz
          - zlib
          - zstd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # - name: Download artifact
      #   uses: actions/download-artifact@v6
      #   with:
      #     name: myimage
      #     path: ${{ runner.temp }}

      # - name: Load image
      #   run: |
      #     podman load --input ${{ runner.temp }}/myimage.tar
      #     podman image ls -a

      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}

  rootfs:
    runs-on: ubuntu-24.04
    needs:
      - build
      - kernel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages

      - run: find packages -name '*.tar' -exec tar xf {} \;

      - name: Display structure of downloaded files
        run: find rootfs

      # Packages are compiled against the Debian builder's libraries, so a missing
      # runtime dependency is invisible until the binary is exec'd in qemu.
      - name: Check for unresolved library dependencies
        run: ./check-rootfs-deps.sh rootfs

      # And a library that is present can still be the wrong one: this is what proves
      # the packages were built against our glibc and not the builder image's.
      - name: Check for unsatisfied symbol versions
        run: ./check-symbol-versions.sh rootfs

      - run: mkdir -p output

      - name: Create disk image
        run: |
            podman build -t rootfs-builder -f rootfs.Containerfile .
            podman run --volume "$PWD"/rootfs:/usr/local/src --volume "$PWD"/output:/usr/local/output rootfs-builder /usr/local/bin/build-rootfs.sh

      - name: Upload rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-dir
          path: rootfs

      - name: Upload rootfs.ext4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs.ext4
          path: output/rootfs.ext4

  # An image that builds and resolves all its libraries can still fail to boot, so
  # actually boot it: the kernel we build is in rootfs/boot/bzImage.
  boot:
    runs-on: ubuntu-24.04
    needs:
      - rootfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs.ext4
          path: image

      # Just the kernel package, not the whole assembled rootfs artifact: the image is
      # already in image/rootfs.ext4 and qemu only needs the bzImage next to it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-kernel
          path: image

      - run: tar xf image/kernel.tar

      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Boot the image
        run: ./boot-test.sh image/rootfs.ext4 rootfs/boot/bzImage

      # A second boot, this one all the way into systemd: networkd has to configure the
      # NIC, resolved has to answer, and the guest has to reach the outside world.
      - name: Check networking
        # A full systemd boot plus a login, rather than the single exec boot-test.sh
        # needs, so give it more room than the 300s default when qemu emulates.
        env:
          TIMEOUT: 600
        run: ./network-test.sh image/rootfs.ext4 rootfs/boot/bzImage

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-console-log
          path: |
            boot-test.log
            network-test.log
