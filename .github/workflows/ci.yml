name: CI
on:
  # Every push runs this workflow, so every commit gets the same checks to require: the
  # `changes` job decides whether the image has to be built at all, and `result` is the
  # one status that sums the rest up (see both, below). A push touching only prose —
  # docs/** and the root *.md, never **.md, since image/files is copied into the image —
  # runs the `docs` check and skips the build, in seconds.
  push:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Build everything from scratch: rebuild the builder and sources images and ignore the package cache"
        type: boolean
        default: false
  # A clean build of main every two weeks. Every input here is pinned and every result
  # cached, which is exactly the arrangement in which a build can stop working without any
  # run noticing: a cache hit proves only that the inputs once built. So this run trusts
  # nothing it did not make — the builder is rebuilt from the Debian snapshot, the sources
  # image from upstream's URLs, every package without its cache (`fresh` below) — and
  # publishes the result like any run on main. At night in Europe (22:00 CEST, 21:00
  # CET), like the other scheduled workflows, and an hour before update-packages.yml opens
  # its pull requests, whose runs then mostly find a warm cache. The time is also when
  # the cache key's period turns over (.github/actions/build-package), so this is the
  # first run of each period; change the two together.
  schedule:
    - cron: "0 20 1,15 * *"

permissions:
  pull-requests: write

# Every per-arch job runs on a native runner (nothing cross-compiles), chosen once in the
# `&runner` anchor. `needs:` waits for both arches of a job, which costs some wall-clock
# time and saves duplicating every job per arch.
#
# The builder and sources jobs are the only ones that reach the internet. Both images are
# tagged by content hash (tools/image-tags.sh): an existing tag is pulled, not rebuilt.
jobs:
  # Whether this push changes anything the build reads. `false` only for a push whose
  # every changed file is docs/** or a root *.md, compared with the commit before it (a
  # new branch: with main). Anything it cannot tell — another event, a compare that fails
  # or lists 300 files (the API's cap), no files at all — builds.
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - name: Classify the changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          build=true
          if [ "$EVENT" = push ]; then
            base=$BEFORE
            case "$base" in ''|0000000000000000000000000000000000000000) base=$DEFAULT_BRANCH ;; esac
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" --jq '.files[].filename'); then
              count=$(printf '%s' "$files" | grep -c . || true)
              echo "$count file(s) changed against $base"
              if [ "$count" -gt 0 ] && [ "$count" -lt 300 ] &&
                 ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|[^/]*\.md)$'; then
                build=false
              fi
            fi
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
          if [ "$build" = false ]; then
            echo "Documentation only: the image build is skipped, \`docs\` checks the change." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The check every commit gets, a documentation-only one included: links between the
  # markdown files resolve. Seconds, and nothing built.
  docs:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: ./test/check-doc-links.sh

  builder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: &runner ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: write
    strategy: &per-arch
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - &telemetry
        name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          # Not mermaid: the run page concatenates every job's summary and renders
          # each mermaid block in its own iframe, hundreds of them.
          charts: sparkline

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: ./tools/prep.sh --push builder
        env:
          # Only here and in the sources job, never workflow-wide: build.sh calls prep.sh
          # too, and every package job rebuilding the builder for itself is not the point.
          FRESH: &fresh-env ${{ (github.event_name == 'schedule' || inputs.fresh == true) && '1' || '' }}

  # Once for both architectures: the tarballs are the same bytes either way.
  sources:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      packages: ${{ steps.packages.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: ./tools/prep.sh --push sources
        env:
          FRESH: *fresh-env

      # The build matrix, as JSON.
      - name: List the packages the build matrix compiles
        id: packages
        run: |
          source tools/lib.sh
          for pkg in $(all_packages); do
              if [ -z "$(env_get "$pkg" NO_SYSROOT)" ]; then echo "$pkg"; fi
          done | jq -Rnc '[inputs]' | sed 's/^/json=/' >> "$GITHUB_OUTPUT"

  # Everything else compiles against this glibc. The kernel links no libc, so it runs
  # alongside.
  glibc:
    runs-on: *runner
    permissions:
      contents: read
      packages: read
    needs:
      - builder
      - sources
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: glibc
          arch: ${{ matrix.arch }}
          fresh: &fresh ${{ (github.event_name == 'schedule' || inputs.fresh == true) && 'true' || 'false' }}

  kernel:
    runs-on: *runner
    permissions:
      contents: read
      packages: read
      actions: read # main's kernel artifact, for the config report
      pull-requests: write # posting that report on the branch's pull request
    needs:
      - builder
      - sources
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: kernel
          arch: ${{ matrix.arch }}
          fresh: *fresh

      # What this kernel builds in that main's last green one does not, and the reverse,
      # posted on the pull request: a new `default y` driver arrives with a bump and
      # fails nothing. A report, never a failure. Only when the kernel was compiled,
      # since it needs the source tree.
      - name: Report the kernel config against main
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          src=$(find packages/kernel -mindepth 1 -maxdepth 1 -type d -name 'linux-*' | head -1)
          if [ -z "$src" ]; then
            echo "kernel came from the cache, nothing new to report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          main_run=$(gh run list --workflow ci.yml --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$main_run" ] || ! gh run download "$main_run" -n "package-kernel-$ARCH" -D baseline; then
            echo "no kernel artifact from a green run on main to compare against" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tar xf baseline/kernel.tar -C baseline
          ./test/kernel-config-diff.sh baseline/rootfs/boot/config rootfs/boot/config "$src" > config.diff
          if [ ! -s config.diff ]; then
            echo "kernel config ($ARCH): same as main" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          report=$(printf '%s\n' \
            "Kernel config ($ARCH) against main's last green build (run $main_run): what this kernel builds in (+) and no longer does (-)." \
            '' '```diff' "$(cat config.diff)" '```' '' \
            'A driver a VM never needs goes in `vm.config` in `packages/kernel/build.sh`, pushed to this branch. Run: '"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json url --jq '.[0].url // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "$report"
          fi

  build:
    runs-on: *runner
    permissions:
      contents: read
      packages: read
    needs:
      - glibc
      - sources

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        # Every package except glibc and the kernel, listed by the sources job.
        package: ${{ fromJSON(needs.sources.outputs.packages) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          charts: sparkline # see the builder job
          # Most of these jobs are cache hits of a few seconds, where a process
          # trace costs a third of the job and a summary says nothing.
          proc_trace_enable: false
          job_summary: false

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          fresh: *fresh

  rootfs:
    runs-on: *runner
    # actions: read for size-history.sh, which reads earlier runs' artifacts. Naming a
    # block replaces the workflow default, so pull-requests: write (telemetry) is repeated.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    needs:
      - build
      - kernel
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*-${{ matrix.arch }}
          path: artifacts

      # Each artifact into staging/<pkg>/, as a local build leaves it, then the same merge.
      - &unpack-packages
        name: Unpack the packages
        run: |
          # -p: modes as packaged.
          find artifacts -name '*.tar' | sort | while read -r t; do
              mkdir -p "staging/$(basename "$t" .tar)"
              tar xpf "$t" -C "staging/$(basename "$t" .tar)"
          done
          ./tools/merge-staging.sh

      # Static checks; each is cheaper than finding the same thing in qemu.
      - name: Check for unresolved library dependencies
        run: ./test/check-rootfs-deps.sh rootfs

      - name: Check for unsatisfied symbol versions
        run: ./test/check-symbol-versions.sh rootfs

      - name: Check every symbol resolves
        run: ./test/check-symbol-resolution.sh rootfs

      - name: Check the kernel can run containers
        run: ./test/kernel-caps.sh rootfs

      # The same library checks for each extension merged over the base, as a guest sees it.
      - name: Check the extensions' libraries against the base
        run: |
          for ext in extensions/*/; do
              [ -d "$ext/usr" ] || continue
              merged="merged-$(basename "$ext")"
              cp -a rootfs "$merged"
              cp -a --remove-destination "$ext/usr/." "$merged/usr/"
              ./test/check-rootfs-deps.sh "$merged"
              ./test/check-symbol-versions.sh "$merged"
              ./test/check-symbol-resolution.sh "$merged"
              rm -rf "$merged"
          done

      - name: Create disk and OCI images
        run: ./tools/build-image.sh --image-only

      # What must and must not be in each image (test/image-files/), from the manifests the
      # assembly writes: a trim line or a disabled feature that quietly stopped applying.
      - name: Check what the images contain
        run: ./test/check-image-files.sh

      # What the container flavour leaves out of the disk image, by area, and the deps
      # check on its own layer that shows nothing left needs what went: the OCI
      # subtractions, reviewable from the run page. Text in the summary, never mermaid.
      - name: Report what the OCI image leaves out
        run: |
          rc=0
          ./test/oci-trim.sh > oci-trim.txt 2>&1 || rc=$?
          cat oci-trim.txt
          { echo "### OCI against the disk image (${{ matrix.arch }})"; echo '```'; cat oci-trim.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Run the OCI image
        run: FLFS_BUILD="$GITHUB_SHA" ./test/oci.sh output/flfs-oci.tar

      # Binaries built by the runner's gcc, g++, rustc and go: libgcc_s, libstdc++ and
      # zoneinfo, which nothing compiled here asks for.
      - name: Run binaries built elsewhere
        run: |
          ./test/prebuilt.sh build output/prebuilt
          ./test/prebuilt.sh oci output/prebuilt output/flfs-oci.tar

      # The same bytes, for the boot job to run in the guest.
      - name: Upload binaries built elsewhere
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.arch }}
          path: output/prebuilt

      # Read back by size-history.sh in later runs.
      - name: Upload size reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootfs-size-${{ matrix.arch }}
          path: |
            output/rootfs-size-*.txt
            output/rootfs-files-*.txt

      # The SBOM is hand-written JSON; this is where a parser exists.
      - name: Check the SBOM
        run: ./test/check-sbom.sh

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: output/sbom-*.json

      # Size checks last, after the uploads, so a failure still leaves everything to look
      # at; `always()` so one overage does not hide the others.
      - name: Measure the disk image
        run: ./test/rootfs-size.sh erofs

      - name: Measure the OCI image
        if: always()
        run: ./test/rootfs-size.sh oci

      - name: Compare the OCI image against debian-slim
        if: always()
        run: ARCH=${{ matrix.arch }} ./test/vs-debian-slim.sh

      # The trend over the last builds on main. Telemetry, so it never fails the job.
      - name: Image size over time
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./test/size-history.sh ${{ matrix.arch }}

      - name: Upload rootfs.erofs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          # The image and the command line carrying its root hash: neither boots alone.
          path: |
            output/rootfs.erofs
            output/rootfs.cmdline

      - name: Upload OCI image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-image-${{ matrix.arch }}
          path: output/flfs-oci.tar

      - name: Upload system extensions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: |
            output/extensions
            output/confexts

      # What tools/fetch-image.sh checks a download against before installing it: this
      # run, its commit and arch, and the SHA-256 of every file in the three artifacts a
      # boot needs, by artifact name and path inside it (the format is in that script).
      # The kernel is the package artifact this job downloaded, the one fetch takes too.
      - name: Write the boot bundle's manifest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          entry() { echo "sha256 $(sha256sum "$1" | cut -d' ' -f1) $2"; }
          {
            echo "# flfs boot bundle; tools/fetch-image.sh verifies downloads against it"
            echo "run $GITHUB_RUN_ID"
            echo "commit $GITHUB_SHA"
            echo "arch $ARCH"
            entry output/rootfs.erofs "rootfs.erofs-$ARCH/rootfs.erofs"
            entry output/rootfs.cmdline "rootfs.erofs-$ARCH/rootfs.cmdline"
            entry "artifacts/package-kernel-$ARCH/kernel.tar" "package-kernel-$ARCH/kernel.tar"
            find output/extensions output/confexts -type f | LC_ALL=C sort | while read -r f; do
              entry "$f" "extensions-$ARCH/${f#output/}"
            done
          } > output/bundle.txt
          cat output/bundle.txt

      - name: Upload the boot bundle's manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}
          path: output/bundle.txt

  # Assemble the images a second time and require the same bytes.
  reproducible:
    runs-on: *runner
    permissions:
      contents: read
      pull-requests: write
    needs:
      - rootfs
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          path: output

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-image-${{ matrix.arch }}
          path: output

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: output

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: output

      - *unpack-packages

      - name: Check the images are reproducible
        run: |
          outputs="output/rootfs.erofs output/rootfs.cmdline output/flfs-oci.tar output/sbom-erofs.json output/sbom-oci.json"
          outputs+=" $(ls output/extensions/*.raw output/confexts/*.raw)"
          sha256sum $outputs > first.sha256
          ./tools/build-image.sh --image-only > second-build.log 2>&1 || { tail -50 second-build.log; exit 1; }
          sha256sum --check first.sha256

  boot:
    runs-on: *runner
    needs:
      - rootfs
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          path: artifacts

      # Next to the image, where test/qemu-lib.sh looks for SYSEXTS.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-kernel-${{ matrix.arch }}
          path: artifacts

      - run: tar xf artifacts/kernel.tar

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prebuilt-${{ matrix.arch }}
          path: artifacts/prebuilt

      # qemu-system-arm is the package with qemu-system-aarch64. virtiofsd, socat and
      # vhost_vsock are test/vmm.sh's, which skips what the host cannot provide.
      - name: Install qemu
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          sudo apt-get install -y --no-install-recommends virtiofsd socat
          sudo modprobe vhost_vsock && sudo chmod 666 /dev/vhost-vsock || true

      - name: Boot the image
        run: ./test/boot.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check that dm-verity refuses a tampered image
        run: ./test/verity.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check for failed units, and say hello
        run: ./test/systemd.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check networking
        run: ./test/network.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check what listens on the network
        run: ./test/listeners.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check ssh, and binaries built elsewhere
        run: PREBUILT=artifacts/prebuilt ./test/ssh.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check containers
        run: ./test/container.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check podman
        run: ./test/podman.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check rootless containers
        run: ./test/rootless.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check a persistent /var
        run: ./test/persistent-var.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check the debug extension
        run: ./test/debug.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check system extensions
        run: ./test/sysext.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check Firecracker- and Virtualization.framework-shaped boots
        run: ./test/vmm.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-console-log-${{ matrix.arch }}
          path: output/*.log

  # A three-node kubeadm cluster (test/k8s.sh). Its own job because it needs KVM (it
  # skips without), and nothing waits on it, since it depends on registry.k8s.io.
  k8s:
    runs-on: *runner
    needs:
      - rootfs
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-kernel-${{ matrix.arch }}
          path: artifacts

      - run: tar xf artifacts/kernel.tar

      - name: Install qemu, and open /dev/kvm to the runner user
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Check a Kubernetes cluster
        run: ./test/k8s.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-console-log-${{ matrix.arch }}
          path: output/*.log
          if-no-files-found: ignore

  # Kubernetes node conformance (test/node-conformance.sh): upstream's node e2e suite,
  # [NodeConformance] specs, on one node with the kubernetes extension. Like k8s, it needs
  # KVM (it skips without) and registry.k8s.io, so nothing waits on it. Failed specs are
  # annotations and in the job summary; the suite's output and results are an artifact.
  node-conformance:
    runs-on: *runner
    needs:
      - rootfs
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-kernel-${{ matrix.arch }}
          path: artifacts

      - run: tar xf artifacts/kernel.tar

      - name: Install qemu, and open /dev/kvm to the runner user
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      # The suite takes minutes to compile and changes only with the Kubernetes version.
      - name: Restore the node e2e suite
        id: suite
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/node-e2e/${{ matrix.arch }}
          key: node-e2e-${{ matrix.arch }}-${{ hashFiles('packages/kubernetes/env.sh', 'tools/build-node-e2e.sh') }}

      - name: Check node conformance
        run: ./test/node-conformance.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Save the node e2e suite
        if: always() && steps.suite.outputs.cache-hit != 'true' && hashFiles(format('output/node-e2e/{0}/VERSION', matrix.arch)) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/node-e2e/${{ matrix.arch }}
          key: ${{ steps.suite.outputs.cache-primary-key }}

      - name: Upload the suite's output and console log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-conformance-${{ matrix.arch }}
          path: |
            output/node-conformance/
            output/node-conformance-console.log
          if-no-files-found: ignore

  # The one status to require in branch protection: whatever this push needed passed.
  # The per-job, per-arch checks come and go with the matrix and are skipped for
  # documentation, and a skipped job satisfies a required check, so requiring them would
  # be both brittle and vacuous. This fails if any job it names failed or was cancelled,
  # and passes when the build was skipped by `changes` and `docs` passed. k8s and
  # node-conformance gate nothing, as before; publish-oci is a deployment, not a check.
  result:
    runs-on: ubuntu-26.04
    if: always()
    needs:
      - changes
      - docs
      - builder
      - sources
      - glibc
      - kernel
      - build
      - rootfs
      - reproducible
      - boot
    permissions: {}
    steps:
      - name: Sum up the jobs this push needed
        env:
          RESULTS: ${{ toJSON(needs) }}
          BUILD: ${{ needs.changes.outputs.build }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$bad" ]; then
            echo "failed: $(echo $bad)" >&2
            exit 1
          fi
          # A build that was wanted has to have run, not merely not failed.
          if [ "$BUILD" = true ] && [ "$(echo "$RESULTS" | jq -r '.boot.result')" != success ]; then
            echo "the build was needed, and boot did not succeed" >&2
            exit 1
          fi
          [ "$(echo "$RESULTS" | jq -r '.changes.result')" = success ] || { echo "changes did not run" >&2; exit 1; }

  # Both architectures as one manifest list, so one job once both exist. After boot: the
  # OCI image is the same userspace as the disk. Only on main, because `latest` has one
  # holder.
  publish-oci:
    runs-on: ubuntu-26.04
    needs:
      - boot
      - reproducible
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tools/publish-oci.sh reads artifacts/oci-image-<arch>/flfs-oci.tar.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oci-image-*
          path: artifacts

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: ./tools/publish-oci.sh
