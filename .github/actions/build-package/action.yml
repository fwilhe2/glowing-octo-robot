name: Build package
description: >
  Build one package into staging/<name>/ and upload that tree as the package-<name>
  artifact.
  Used by both the glibc job and the matrix job that follows it.

inputs:
  package:
    description: Package directory to build, e.g. coreutils.
    required: true
  arch:
    description: >
      amd64 or arm64. Everything here builds natively rather than being cross-compiled,
      so this only ever selects which native runner the calling workflow put the job on
      — it doesn't change what build.sh does. It has to be threaded through anyway: the
      binaries one arch produces are meaningless on the other, so the cache key and the
      uploaded artifact name both carry it to keep the two arches from colliding.
    required: true
  fresh:
    description: >
      'true' to build without looking in the cache, for CI's scheduled clean rebuild. The
      result is still saved, so that run also seeds the cache for the period it starts.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Get Cache key
      id: get_key
      shell: bash
      run: |
        source tools/lib.sh
        load_env "${{ inputs.package }}"
        # Whether to compile against our glibc is the package's own NO_SYSROOT, rather than
        # an input the calling job could get out of step with: glibc is where the sysroot
        # comes from and the kernel links no libc.
        if [ -n "${NO_SYSROOT:-}" ]; then sysroot=false; else sysroot=true; fi
        echo "sysroot=$sysroot" >> $GITHUB_OUTPUT
        PKG="packages/${{ inputs.package }}"
        # glibc's env.sh and build.sh are in here for every package: they are compiled
        # against that glibc, so changing its version or how it is configured has to
        # rebuild all of them, not only glibc.
        # The builder image reference is in here rather than the files behind it: it is
        # already a content hash of builder/, so a changed dependency list rebuilds every
        # package, which is what we want and what listing the files by hand used to do.
        #
        # $PKG/src is a LOCAL_SOURCE package's actual source, and it has to be in the key
        # for the same reason env.sh is: for every other package a source change means a
        # new VERSION and so a new env.sh, but here the source can change with env.sh
        # untouched, and a cache hit would then ship the previous build's binary. Sorted,
        # because find's order is the filesystem's and a key has to be deterministic.
        #
        # A FOLLOWS package's VERSION, TARBALL and SHA256 are another package's env.sh,
        # sourced: $PACKAGE in the key catches a version bump, that file the rest.
        follows=
        [ -z "${FOLLOWS:-}" ] || follows="packages/$FOLLOWS/env.sh"
        sum=$(cat build.sh tools/lib.sh builder/build-package.sh packages/glibc/env.sh packages/glibc/build.sh $PKG/build.sh $PKG/env.sh $follows <(./tools/image-tags.sh builder) <(find $PKG/src -type f -print0 2>/dev/null | sort -z | xargs -0r cat) | md5sum | cut -d ' ' -f 1)
        # And the half-month, so nothing is served from the cache for longer than about
        # two weeks. Every input above is pinned, but the claim that a pinned input still
        # builds is only tested by building it — a binary cached for a year says nothing
        # about whether today's checkout compiles. The period turns over at 20:00 UTC on
        # the 1st and the 15th, which is when ci.yml's schedule runs a clean build of
        # main: that run is the first of its period and fills the cache for the rest.
        # Change the two together.
        stamp=$(date -u -d '20 hours ago' +%Y-%m-%d)
        period=${stamp:0:7}-$([ "${stamp:8:2}" -lt 15 ] && echo a || echo b)
        # arch has to be in the key: an amd64 and an arm64 build of the same package at
        # the same script hash produce entirely different, mutually useless binaries.
        echo "key=${{ inputs.arch }}-$PACKAGE-$period-$sum" >> $GITHUB_OUTPUT

    # The staging tree is this package's own files only, so the artifact doesn't ship a
    # copy of glibc with every package. The sysroot is a separate tree.
    - name: Download glibc
      if: steps.get_key.outputs.sysroot == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-glibc-${{ inputs.arch }}
        path: glibc-package

    - name: Stage the sysroot
      if: steps.get_key.outputs.sysroot == 'true'
      shell: bash
      run: |
        mkdir -p sysroot
        tar xf glibc-package/glibc.tar -C sysroot --strip-components=1

    # Restore and save as two steps rather than one actions/cache, so that a fresh build
    # can skip the first and still do the second. No restore-keys: a near-miss is a binary
    # built from different inputs, which is the one thing this cache must never serve.
    - name: Restore from cache
      id: cache-build
      if: inputs.fresh != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # The package's own staging tree, which holds rootfs/ or, for a package whose
        # env.sh names one (EXTENSION=, see build.sh), extensions/<name>/.
        path: staging/${{ inputs.package }}
        key: ${{ steps.get_key.outputs.key }}

    - name: Build
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
      run: SYSROOT_DIR=sysroot ./build.sh ${{ inputs.package }}

    # A fresh build whose key some earlier run of the period already saved gets a warning
    # here and nothing else: entries are immutable, and the two are the same bytes anyway
    # (test/reproducible.sh).
    - name: Save to cache
      if: steps.cache-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: staging/${{ inputs.package }}
        key: ${{ steps.get_key.outputs.key }}

    - name: Tar files to preserve permissions
      shell: bash
      run: |
        # Entries named rootfs/... and extensions/<name>/..., as they always were: the
        # rootfs job unpacks each into staging/<name>/ and merges them the way a local
        # build does (tools/merge-staging.sh).
        # Listed rather than `.`, which would name them ./rootfs/...: glibc's artifact is
        # unpacked with --strip-components=1 and tools/fetch-image.sh asks for the
        # kernel's rootfs/boot/bzImage by name.
        tar cvf ${{ inputs.package }}.tar -C staging/${{ inputs.package }} $(ls -A staging/${{ inputs.package }})

    - name: Upload Package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package-${{ inputs.package }}-${{ inputs.arch }}
        path: ${{ inputs.package }}.tar
