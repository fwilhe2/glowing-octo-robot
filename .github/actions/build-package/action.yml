name: Build package
description: >
  Build one package into rootfs/ and upload the result as the package-<name> artifact.
  Used by both the glibc job and the matrix job that follows it.

inputs:
  package:
    description: Package directory to build, e.g. coreutils.
    required: true
  arch:
    description: >
      amd64 or arm64. Everything here builds natively rather than being cross-compiled,
      so this only ever selects which native runner the calling workflow put the job on
      — it doesn't change what build.sh does. It has to be threaded through anyway: the
      binaries one arch produces are meaningless on the other, so the cache key and the
      uploaded artifact name both carry it to keep the two arches from colliding.
    required: true
runs:
  using: composite
  steps:
    - name: Get Cache key
      id: get_key
      shell: bash
      run: |
        source tools/lib.sh
        load_env "${{ inputs.package }}"
        echo "package=$PACKAGE" >> $GITHUB_OUTPUT
        # Whether to compile against our glibc is the package's own NO_SYSROOT, rather than
        # an input the calling job could get out of step with: glibc is where the sysroot
        # comes from and the kernel links no libc.
        if [ -n "${NO_SYSROOT:-}" ]; then sysroot=false; else sysroot=true; fi
        echo "sysroot=$sysroot" >> $GITHUB_OUTPUT
        PKG="packages/${{ inputs.package }}"
        # packages/glibc/env.sh is in here for every package: they are compiled against
        # that glibc, so bumping its version has to rebuild all of them.
        # The builder image reference is in here rather than the files behind it: it is
        # already a content hash of builder/, so a changed dependency list rebuilds every
        # package, which is what we want and what listing the files by hand used to do.
        #
        # Every file git tracks in the package directory, rather than env.sh and build.sh by
        # name: the source of a LOCAL_SOURCE package changes with neither touched, and the
        # kernel keeps its config fragments and locks beside build.sh, so a hit on a key
        # that listed only those two would ship the previous build. The unpacked tarball is
        # gitignored and not in it. ls-files is sorted, so the key is deterministic.
        echo "build_script_sum=$(cat build.sh tools/lib.sh builder/build-package.sh packages/glibc/env.sh <(./tools/image-tags.sh builder) <(git ls-files -z "$PKG" | xargs -0 cat) | md5sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

    # rootfs/ stays this package's own files only, so the artifact doesn't ship a copy
    # of glibc with every package. The sysroot is a separate tree.
    - name: Download glibc
      if: steps.get_key.outputs.sysroot == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-glibc-${{ inputs.arch }}
        path: glibc-package

    - name: Stage the sysroot
      if: steps.get_key.outputs.sysroot == 'true'
      shell: bash
      run: |
        mkdir -p sysroot
        tar xf glibc-package/glibc.tar -C sysroot --strip-components=1

    - name: Cache
      id: cache-build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: rootfs
        # arch has to be in the key: an amd64 and an arm64 build of the same package at
        # the same script hash produce entirely different, mutually useless binaries.
        key: ${{ inputs.arch }}-${{ steps.get_key.outputs.package }}-${{ steps.get_key.outputs.build_script_sum }}

    - name: Build
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
      run: SYSROOT_DIR=sysroot ./build.sh ${{ inputs.package }}

    # A build that stopped on a lock mismatch — the kernel's config-<arch>.lock — leaves the
    # lock it resolved beside the source as *.lock.new. Uploaded so it can be read and
    # accepted without rebuilding on that arch: tools/kernel-config-lock.sh <run-id>.
    - name: Upload proposed lock files
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: proposed-${{ inputs.package }}-${{ inputs.arch }}
        path: packages/${{ inputs.package }}/*/*.lock.new
        if-no-files-found: ignore

    - name: Tar files to preserve permissions
      shell: bash
      run: tar cvf ${{ inputs.package }}.tar rootfs/*

    - name: Upload Package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package-${{ inputs.package }}-${{ inputs.arch }}
        path: ${{ inputs.package }}.tar
