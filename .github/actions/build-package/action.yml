name: Build package
description: >
  Build one package into rootfs/ and upload the result as the package-<name> artifact.
  Used by both the glibc job and the matrix job that follows it.

inputs:
  package:
    description: Package directory to build, e.g. coreutils.
    required: true
  sysroot:
    description: >
      Whether to compile against our glibc. True for everything except glibc itself,
      which is where the sysroot comes from, and the kernel, which links no libc.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # rootfs/ stays this package's own files only, so the artifact doesn't ship a copy
    # of glibc with every package. The sysroot is a separate tree.
    - name: Download glibc
      if: inputs.sysroot == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-glibc
        path: glibc-package

    - name: Stage the sysroot
      if: inputs.sysroot == 'true'
      shell: bash
      run: |
        mkdir -p sysroot
        tar xf glibc-package/glibc.tar -C sysroot --strip-components=1

    - name: Get Cache key
      id: get_key
      shell: bash
      run: |
        PKG="${{ inputs.package }}"
        source $PKG/env.sh
        echo "package=$PACKAGE" >> $GITHUB_OUTPUT
        # glibc/env.sh is in here for every package: they are compiled against that
        # glibc, so bumping its version has to rebuild all of them.
        echo "build_script_sum=$(cat build.sh build-base.sh Containerfile package.Containerfile lib/build-package.sh glibc/env.sh $PKG/build.sh $PKG/env.sh | md5sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

    - name: Cache
      id: cache-build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: rootfs
        key: ${{ steps.get_key.outputs.package }}-${{ steps.get_key.outputs.build_script_sum }}

    - name: Build
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
      run: SYSROOT_DIR=sysroot ./build.sh ${{ inputs.package }}

    - name: Tar files to preserve permissions
      shell: bash
      run: tar cvf ${{ inputs.package }}.tar rootfs/*

    - name: Upload Package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package-${{ inputs.package }}
        path: ${{ inputs.package }}.tar
