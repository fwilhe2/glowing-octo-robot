name: Set up podman
description: >
  Give podman an OCI runtime it can actually talk to. The ubuntu-24.04 runner image
  moved from podman 4.9.3 to 5.8.4 (image 20260726.254), and podman 5 writes an OCI
  config declaring runtime-spec v1.2.1 — which the crun 1.14.1 that Ubuntu 24.04 ships
  rejects outright with "unknown version specified". Every `podman build` dies before
  it runs a single command. crun fixed the version parsing in 1.14.3.

  Nothing in this repo caused it and nothing in this repo can avoid it: the runner
  image rollout is gradual, so which jobs fail depends on which image version they
  land on. Installing a known-good crun is the only fix that does not depend on
  guessing what else the runner has.

runs:
  using: composite
  steps:
    - name: Install a crun podman can use
      shell: bash
      run: |
        set -euo pipefail

        # The version this repo already pins for the image, so there is no second
        # place to bump. The published binary is fully static, so it does not care
        # what the runner's glibc is.
        source crun/env.sh

        url="https://github.com/containers/crun/releases/download/${VERSION}/crun-${VERSION}-linux-amd64"
        sudo curl -fsSL --retry 3 --retry-delay 2 -o /usr/local/bin/crun "$url"
        sudo chmod +x /usr/local/bin/crun

        # /usr/local/bin is not one of the paths podman searches for a runtime — it
        # resolves `crun` through containers.conf, which points at /usr/bin/crun — so
        # say explicitly where to find this one rather than relying on PATH order.
        mkdir -p ~/.config/containers
        cat > ~/.config/containers/containers.conf <<'EOF'
        [engine]
        runtime = "crun"

        [engine.runtimes]
        crun = ["/usr/local/bin/crun"]
        EOF

        echo "podman:   $(podman --version)"
        echo "crun:     $(/usr/local/bin/crun --version | head -1)"
        echo "selected: $(podman info --format '{{.Host.OCIRuntime.Path}}')"
