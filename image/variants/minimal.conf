# A machine that boots to a login shell on the serial console, and nothing else.
#
# "Minimal" here means *nothing unnecessary was added*, not "as few packages as will
# link" — constraint 1 in CLAUDE.md is not negotiable, so systemd, glibc, GNU coreutils
# and bash are all in, and so is everything systemd drags behind it. That is most of the
# list below and it is why this variant is far less minimal than the word suggests:
# dbus and expat because logind exits without a system bus, pam and libxcrypt because
# login authenticates, libbpf and elfutils because systemd's sandboxing loads BPF
# programs through libbpf, zlib/xz/zstd because journald compresses with them, acl/attr
# and ncurses and util-linux because coreutils and bash and systemd all link them.
#
# What is genuinely absent is the userspace a person reaches for once the machine is up:
# no network stack tooling, no TLS, no container runtime, no text utilities. `net` adds
# the first two, `full` adds the rest.
#
# The list is additive and explicit, and that is deliberate — a new package joins `full`
# silently, through its `package *`, and joins this one only because somebody decided it
# belonged in a machine that does nothing but boot.
description  Boots to a login shell on the serial console, and nothing else
platforms    ext4 oci
tests        boot systemd

# The stack constraint 1 names, plus what it links against.
package      glibc bash ncurses
package      coreutils acl attr
package      util-linux pam libxcrypt
package      systemd dbus expat libcap libbpf elfutils kmod
package      zlib xz zstd

# The kernel, because the ext4 platform ships a bootable disk and /boot is where the
# image carries one. The oci platform omits it; see image/platforms/oci.conf.
package      kernel

# fsck for the root filesystem systemd-fsck runs at boot, and the /etc/services and
# /etc/protocols that nsswitch.conf has been naming all along. Both are here rather than
# in `net` because a machine that cannot check its own root filesystem is not a floor.
package      e2fsprogs iana-etc

# The only binary in usr/bin that anything in test/ runs for its own sake, which makes
# it the canary test/systemd.sh needs — and `tests systemd` above is a promise this
# variant has one. It links nothing but glibc.
package      flfsfetch
