# Minimal, plus a network somebody can debug.
#
# Constraint 4 in CLAUDE.md draws the line this variant exists to be on the right side
# of: a booted image has to have working interfaces, addressing, DNS and outbound
# connectivity — and it has to be *usable* from inside the guest, which is a separate
# claim. `minimal` already has systemd-networkd and systemd-resolved, so it has a
# network; what it does not have is `ip`, `ping` and `curl`, which are the difference
# between a machine that has a network and one somebody can debug.
#
# That is also exactly what test/network.sh's two rounds ask, in that order — see the
# `tests` line.
description  Minimal, plus a network somebody can debug: addressing, DNS, TLS
extends      minimal
platforms    ext4 oci
tests        boot systemd network

# TLS: openssl, curl built --with-openssl, and Debian's snapshot of Mozilla's roots as
# the bundle curl is compiled to look for.
package      openssl ca-certificates curl

# Addressing and reachability. libmnl is not optional decoration: without it iproute2's
# configure sets HAVE_MNL:=n and silently drops half the tool set.
package      iproute2 iputils libmnl
