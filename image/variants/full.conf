# Everything this repository builds — the image this project had before variants
# existed, unchanged.
#
# `default yes` is what keeps that true in the places a name is a promise: this variant
# owns the unsuffixed output/rootfs.ext4 and output/flfs-oci.tar, the sbom-ext4.json and
# sbom-oci.json test/check-sbom.sh reads, the rootfs-size-ext4.txt row in
# test/size-budget.txt, and the `flfs:latest` and `flfs:<commit>` tags that already have
# consumers. Exactly one variant may carry it.
#
# `package *` is every package with an env.sh, which is the one place a variant is
# allowed not to name its contents. The trade is stated in docs/image-variants.md: a new
# package joins this variant silently and every other one deliberately, which is the
# right default for an image whose selling point is that nothing unnecessary is in it —
# and it does mean a new package's pull request now touches the variants that should
# carry it.
description  Everything this repository builds. The image published as flfs:latest.
extends      net
platforms    ext4 oci
tests        boot systemd network ssh container
publish      oci
default      yes

package      *
