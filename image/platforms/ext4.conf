# A bootable disk for qemu: `mkfs.ext4 -d` over the assembled tree, booted with the
# kernel handed in from outside (`qemu -kernel`). The real output of this repository.
#
# It subtracts nothing. Everything the variant selected is in the image, which is what
# makes this the flavour every other one is described as a difference from — the same
# way vm.config is written as subtractions from defconfig.
description  A bootable disk for qemu, with the kernel passed in with -kernel
format       ext4
