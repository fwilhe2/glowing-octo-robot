# A container image: the host provides the kernel, the runtime provides PID 1.
#
# Everything below is a *physical* constraint of the target rather than an opinion about
# what belongs in an image, which is why it lives on the platform axis and why a variant
# cannot override it. A container has no kernel to boot and no PID 1 to be — and a
# systemd that cannot run is worse than dead weight, because it is still a systemd
# somebody will try to run.
#
# This file is what the seventy-line subtractions block in image/build-rootfs.sh used to
# be. The two derivations it needed are gone with it, both for the same reason: the
# files were systemd's, so the per-package manifests already knew. No readelf sweep for
# the binaries linking the private libsystemd-shared (systemctl, journalctl, udevadm and
# the forty-odd systemd-* tools), and no two-pass dangling-symlink walk for /sbin/init,
# halt, poweroff, reboot, shutdown, resolvconf, run0 and the mount.* helpers.
format       oci

# The kernel is the host's. systemd is the runtime's job. kmod is dead for a reason that
# has nothing to do with containers — packages/kernel builds CONFIG_MODULES=n, so there
# is no module to insert anywhere — and the disk image keeps it only because
# systemd-modules-load and udev reach libkmod and a missing library there is a failed
# unit rather than a smaller image. With systemd gone, so is that reason.
#
# PAM goes because it is already *broken* in a container here, not merely unusual:
# /etc/pam.d is dropped below with the rest of the /etc only a booted machine reads, and
# libpam with no configuration for a service does not fall back to something permissive,
# it aborts. `su -c ... root` in the published image used to answer "su: Critical error
# - immediate abort". /etc/shadow is gone too, so there would be nothing to
# authenticate against even with a config.
omit         kernel systemd kmod pam

# libsystemd.so.0 stays. It is the public client library, not part of systemd the
# system, and ten binaries this image keeps have it in NEEDED — crun and libmount.so.1
# among them, which is to say the container runtime and `mount`.
#
# libudev.so.1 deliberately does *not* get the same rescue, and that is the one place
# the two libraries part company: once udev and udevadm are gone nothing in the
# container names it, by NEEDED or by dlopen, and it was 1.6 MB of client library with
# no client. The check that keeps that true is now general rather than libudev's own —
# build-rootfs.sh fails the image if any surviving executable references a library
# selection removed. See "what makes selection safe" in docs/image-variants.md.
keep         usr/lib/libsystemd.so.0*

# PAM's consumers, which are util-linux's files rather than pam's and so survive the
# omission above. A container has no serial line and no PID 1 to start a getty on it,
# and su/runuser/login have nothing left to authenticate against.
#
# Named rather than derived, and that is a deliberate downgrade from the `grep -a`
# sweep this replaces: the sweep could not go stale, and this can. What makes that an
# acceptable trade is that going stale is now *loud* — a util-linux that grows another
# PAM-linked helper ships a binary whose NEEDED names a library this image does not
# have, and the dependency check fails the build naming both.
drop         usr/bin/login usr/bin/su usr/bin/runuser usr/bin/agetty

# The empty /boot the directory skeleton creates once the kernel package is gone from
# it. Selection removes files; the bones of the tree are built regardless, so the one
# directory a container must not have has to be named.
drop         boot

# The /etc that only a booted machine reads: a root filesystem to mount, a password to
# type at a login prompt that is not there, a NIC for networkd to configure, kernel
# parameters a container has no business setting. The runtime supplies hostname and
# resolv.conf — ours pointed into resolved's /run stub, which nothing will ever create
# here.
#
# /etc/hosts is *not* in this list, and the omission is the interesting one. A runtime
# bind-mounts its own over it, so it is not what the container will read — but a static
# localhost mapping is correct either way and a missing file is not: `podman run
# --network=none` mounts nothing.
drop         etc/fstab etc/shadow etc/hostname etc/resolv.conf
drop         etc/pam.d etc/systemd etc/sysctl.d
