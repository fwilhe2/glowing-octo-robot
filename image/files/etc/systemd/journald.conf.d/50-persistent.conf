# Keep the journal in /var/log/journal rather than /run. On the default tmpfs /var that
# is the same RAM under another name — journald moves the runtime journal there at flush
# rather than keeping two — and on a VM given a persistent /var (see
# /usr/lib/systemd/system/var.mount) it is what makes the logs of the previous boot
# readable. Storage=auto would only do that if the directory existed, and nothing creates
# it on a fresh disk.
[Journal]
Storage=persistent
