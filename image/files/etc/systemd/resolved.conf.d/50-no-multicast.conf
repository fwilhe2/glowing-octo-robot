# No LLMNR or mDNS: both are local-network name discovery, and resolved answers them on
# every interface (:5355 and :5353, TCP and UDP) for a machine nobody looks up by a
# multicast name. A VM is found through its VMM's network, by address or by real DNS.
# test/listeners.sh holds the image to the sockets it opens.
[Resolve]
LLMNR=no
MulticastDNS=no
