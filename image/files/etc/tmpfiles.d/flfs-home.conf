# /home is a tmpfs (see /etc/fstab), so the unprivileged account's home has to be made at
# every boot. Nothing else would: there is no pam_mkhomedir and no shadow-utils, and bash
# started in a working directory that does not exist is the symptom.
d /home/user 0700 user user -

# The key the host handed this boot as ssh.authorized_keys.root logs in as `user` too, so
# `./tools/ssh.sh --user` is a login of its own — with a logind session, /run/user/1000
# and a user manager, which rootless podman needs and `su user` from root's session cannot
# give it (pam_systemd will not open a second session inside one, and su keeps root's
# $XDG_RUNTIME_DIR). sshd reads authorized_keys as the target user, so this has to be a
# copy rather than the Match-block path root uses; `f^` only writes a missing file, which
# on a /home that is a tmpfs means once per boot, from this boot's key.
d  /home/user/.ssh                 0700 user user -
f^ /home/user/.ssh/authorized_keys 0600 user user - ssh.authorized_keys.root
