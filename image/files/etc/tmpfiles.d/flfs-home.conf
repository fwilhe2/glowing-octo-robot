# /home and /root are symlinks to var/home and var/roothome (image/build-rootfs.sh), so
# they are in RAM, or on the VM's /var disk and kept, with the rest of /var. Their targets
# are made here, at every boot: this file sorts before systemd's home.conf and
# provision.conf, whose lines for /home and /root go through the links. Nothing else
# would make the unprivileged account's home either — there is no pam_mkhomedir — and
# bash started in a working directory that does not exist is the symptom.
d /var/home      0755 root root -
d /var/roothome  0700 root root -
d /var/home/user 0700 user user -

# The key the host handed this boot as ssh.authorized_keys.root logs in as `user` too, so
# `./tools/ssh.sh` logs in as `user` by default — a login of its own — with a logind
# session, /run/user/1000 and a user manager, which rootless podman needs and `su user`
# from root's session cannot give it (pam_systemd will not open a second session inside
# one, and su keeps root's $XDG_RUNTIME_DIR). sshd reads authorized_keys as the target
# user, who cannot read /run/credentials, so this is a copy, and in /run rather than
# ~/.ssh: `f^` only writes a missing file, and a home on a /var disk would keep the first
# boot's key forever and refuse every later one. sshd_config's AuthorizedKeysFile names
# it (packages/openssh/build.sh); ~/.ssh/authorized_keys is the user's own, and kept.
d  /run/ssh-authorized-keys      0755 root root -
f^ /run/ssh-authorized-keys/user 0600 user user - ssh.authorized_keys.root
