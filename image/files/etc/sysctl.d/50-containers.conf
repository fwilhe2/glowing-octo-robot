# Limits a container host or Kubernetes node outgrows at the kernel's defaults, as Talos,
# LinuxKit and podman-machine-os raise them. systemd's 50-pid-max.conf already raises
# kernel.pid_max.
#
# Not set: fs.inotify.max_user_watches, whose default scales with memory since Linux
# 5.11; vm.overcommit_memory = 1, which changes how every process fails and which kubelet
# sets itself when it wants it.

# inotify instances per user. 128 is exhausted by kubelet and a few dozen containers each
# watching files: "too many open files" from `kubectl logs -f` or a file watcher.
fs.inotify.max_user_instances = 8192
# Memory map areas per process; Elasticsearch and OpenSearch refuse to start below this.
vm.max_map_count = 262144
# Outstanding asynchronous I/O requests, for databases in containers.
fs.aio-max-nr = 1048576
# Reboot ten seconds after a panic instead of hanging forever. The tests run qemu with
# -no-reboot, so a panic still ends the boot and is still reported as the guest dying.
kernel.panic = 10
