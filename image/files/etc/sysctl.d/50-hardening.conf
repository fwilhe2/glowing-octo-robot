# Kernel Self Protection Project recommendations, as Talos and LinuxKit set them, minus
# the ones that would break rootless containers or the debug extension.
#
# Deliberately not set:
#   user.max_user_namespaces = 0 (Talos): rootless podman runs in a user namespace.
#   kernel.perf_event_paranoid = 3: a distribution patch; upstream stops at 2, its default.
#   vm.unprivileged_userfaultfd = 0: there is no userfaultfd (USERFAULTFD is off).

# Kernel addresses hidden from /proc and logs but for CAP_SYSLOG: an attacker who knows
# where the kernel is has defeated KASLR. Not 2 (Talos), which hides them from root too
# and so breaks `perf probe` on a kernel function (test/debug.sh).
kernel.kptr_restrict = 1
# The kernel log is root's: it carries addresses and hardware details.
kernel.dmesg_restrict = 1
# BPF for CAP_BPF only, for good: the kernel's default (BPF_UNPRIV_DEFAULT_OFF) is the
# same, but can be turned back off at runtime; 1 cannot. The JIT blinds the constants of
# every program, root's included, so a program cannot plant code in it.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# ptrace only of a process's own descendants (Yama, kspp.config in packages/kernel), so
# a compromised process cannot read its neighbours' memory. Not 2, which leaves ptrace
# to CAP_SYS_PTRACE: strace and gdbserver would stop working for `user`.
kernel.yama.ptrace_scope = 1
# No terminal line discipline loaded by an unprivileged open, and no TIOCSTI: faking input
# into another process's terminal is how a contained process escapes through it.
dev.tty.ldisc_autoload = 0
dev.tty.legacy_tiocsti = 0
# Links, FIFOs and regular files in sticky world-writable directories (/tmp) are only
# followed or opened by their owner: the /tmp race attacks. systemd's 50-default.conf
# sets the first two the same and the last two to 1; 2 extends them to group-writable
# sticky directories. This file sorts after it, so it wins.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# No core dump of a process that changed its credentials. The kernel's default, stated
# as the KSPP list states it.
fs.suid_dumpable = 0
