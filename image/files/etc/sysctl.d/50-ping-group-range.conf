# Let unprivileged users ping.
#
# iputils' ping asks for a datagram ICMP socket first and only falls back to a raw one,
# and the datagram kind is allowed for any process whose gid is inside this range. The
# kernel's default is "1 0" — an empty range, deliberately, so that the socket type is
# off until someone opts in — which leaves ping working for root and failing for the
# uid-1000 account image/files/etc/passwd ships with "Operation not permitted".
#
# The alternatives are worse: setuid root, or a CAP_NET_RAW file capability that would
# have to survive mkfs.ext4 -d and the OCI layer tar. This is one line applied by
# systemd-sysctl at boot, and it is what Fedora and Arch do.
net.ipv4.ping_group_range = 0 2147483647
