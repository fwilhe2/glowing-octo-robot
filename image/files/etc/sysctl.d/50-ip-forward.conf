# Route between interfaces, which is what a container host does.
#
# Every container network here is a bridge plus NAT: a veth pair per container into a
# bridge, and the host forwarding between that bridge and its uplink. With the kernel's
# default of 0 the containers can reach the host and nothing past it. Docker's default
# iptables backend flips this itself at start; its nftables backend refuses to, and
# dockerd exits with "IPv4 forwarding is disabled". Kubernetes' node checks fail on it
# the same way. Setting it here means neither depends on which backend is chosen.
#
# systemd-networkd leaves the global setting alone unless networkd.conf sets
# IPv4Forwarding=, so this line is what decides it. It does make the machine a router
# between all of its interfaces, which is what every container host and Kubernetes node
# is; what crosses between them is the engine's nftables rules' business.
net.ipv4.ip_forward = 1
