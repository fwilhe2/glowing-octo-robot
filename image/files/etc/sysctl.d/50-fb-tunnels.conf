# No fallback tunnel devices in network namespaces other than the host's.
#
# With modules off, the kernel's tunnel drivers are built in, and a built-in one adds
# its fallback device to every new network namespace — today sit0, from IPV6_SIT, which
# defconfig turns on. So every container and every pod got an interface nobody made,
# down and carrying nothing, which monitoring then reports: kubelet's cAdvisor lists it
# among a pod's interfaces at 0 bytes, and node conformance's ContainerMetrics test
# fails on exactly that. A distribution kernel has sit as a module nothing loads, which
# is why this is the default nowhere else.
#
# 1 keeps the host's own fallback devices and stops the rest. A tunnel someone does
# want is unaffected: `ip tunnel add` makes one in any namespace.
net.core.fb_tunnels_only_for_init_net = 1
