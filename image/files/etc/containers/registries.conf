# The containers/image configuration every engine here reads — podman, and CRI-O in the
# kubernetes extension — which is why it ships with the base's /etc and not with either
# engine (docs/sysext.md). Without these two files podman refuses to pull anything.
# Everything else is the engines' compiled-in default, so there is no containers.conf or
# storage.conf to keep in step with a version bump.
#
# policy.json beside this, which JSON gives no room to explain, is what every distribution
# ships by default: accept unsigned images, refuse nothing. Tightening it is a
# per-registry decision for whoever runs the machine.
#
# This file is where a bare `podman pull alpine` looks. One registry, so a short name
# resolves without asking — there is no terminal to ask on when a Quadlet unit pulls at
# boot — and it is the one a short name means everywhere else. Fully qualified names
# always work.
unqualified-search-registries = ["docker.io"]
short-name-mode = "permissive"
