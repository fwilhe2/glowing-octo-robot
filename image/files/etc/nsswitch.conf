# Every module named here has to exist in the image as libnss_<name>.so.2, or the
# lookup silently loses that source. glibc installs files, dns, compat, db and hesiod;
# systemd installs systemd, myhostname and resolve. The five used below are all staged.

# `systemd` resolves what nss-systemd knows and these files do not: DynamicUser=
# allocations, and any other userdb record. Without it only what systemd-sysusers has
# already written into /etc/passwd and /etc/group is visible, so a unit using
# DynamicUser= gets a uid that nothing can name.
#
# [SUCCESS=merge] on group is what lets a user pick up supplementary groups from both
# sources instead of stopping at whichever answers first.
passwd:     files systemd
group:      files [SUCCESS=merge] systemd
shadow:     files systemd

# resolve talks to systemd-resolved over varlink rather than to its 127.0.0.53 stub, so
# it gets resolved's own answers instead of a DNS round trip through a listener.
#
# [!UNAVAIL=return] is the load-bearing part: a NOTFOUND from resolved is authoritative
# and ends the lookup, but resolved being *unavailable* — not running yet, or not
# running at all — falls through to the static sources behind it. That is what keeps
# /etc/hosts and myhostname reachable on a boot that has not started resolved.
hosts:      resolve [!UNAVAIL=return] files myhostname dns

# glibc reads each of these from a file or not at all — there is no module to name, so
# `files` is the whole answer. /etc/rpc comes from glibc's own install, /etc/services and
# /etc/protocols from the iana-etc package. /etc/ethers and /etc/networks are in neither,
# so those two lookups still fail; nothing in the image asks them.
protocols:  files
services:   files
ethers:     files
rpc:        files
networks:   files
